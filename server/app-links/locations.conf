# Include inside the HTTPS server for app.tngl.pro.
location = /.well-known/assetlinks.json {
    alias /var/www/tngl-return/assetlinks.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=300";
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /billing/return {
    alias /var/www/tngl-return/return.html;
    default_type text/html;
    access_log off;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /billing/return.js {
    alias /var/www/tngl-return/return.js;
    default_type application/javascript;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff";
}
