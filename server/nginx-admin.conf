# Include from nginx's http context (e.g. /etc/nginx/conf.d/tngl-admin.conf).
limit_req_zone $binary_remote_addr zone=tngl_admin:10m rate=30r/m;

server {
    listen 9443 ssl;
    server_name auth.tngl.pro;

    ssl_certificate /etc/letsencrypt/live/auth.tngl.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.tngl.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;

    location / {
        limit_req zone=tngl_admin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
