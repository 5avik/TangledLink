name: Build and test

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and run JVM tests
        run: bash ./gradlew :app:assemblePlaystoreDebug :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugAndroidTestKotlin --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: tngl-debug-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
